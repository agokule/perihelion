name: Build and Deploy to GitHub Pages

on:
  push:
    tags:
      # NOTE: these are GitHub filter patterns (globs), NOT regexes.
      # Only * ** + ? [] ! are special; anchors/groups/alternation are not supported.
      - '[0-9]+.[0-9]+.[0-9]+'      # 1.2.3
      - '[0-9]+.[0-9]+.[0-9]+-*'    # 1.2.3-rc.1

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued; you may prefer to change this.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  EM_VERSION: 6.0.9
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup cache
        id: cache-system-libraries
        uses: actions/cache@v5
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: ${{env.EM_VERSION}}-${{ runner.os }}

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      # Create and build to build-web/bin
      - name: Build application
        run: |
          just build-web Release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build-web/bin'

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
